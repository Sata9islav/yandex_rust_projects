[package]
name = "blog-server"
version = "0.1.0"
edition = "2024"

[dependencies]

# gRPC
blog-proto = { path = "../blog-proto" }

# HTTP API
actix-cors = "0.7.2"
actix-web = "4.18.1"
actix-web-httpauth = "0.8.3"

# SQL
sqlx = { version = "0.9.0", features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring"] }

# JWT
jsonwebtoken = {version = "11.1.0", features = ["rust_crypto"] }
argon2 = { version = "0.6", features = ["getrandom"] }

# Serializ
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Async
tokio = {workspace = true}
chrono = { version = "0.4.45", features = ["serde"] }

# Error
anyhow = "1.0.104"
thiserror = "2.0.21"

# Logging
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}

# Env
dotenvy = "0.15.7"
tonic = "0.14.6"
