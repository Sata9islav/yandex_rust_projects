[package]
name = "blog-client"
version = "0.1.0"
edition = "2024"

[dependencies]
blog-proto = { path = "../blog-proto" }

reqwest = { version = "0.13", features = ["json", "query"] }
tonic = "0.14.6"

serde = { workspace = true }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tokio = { workspace = true }
anyhow = "1"
thiserror = "2"