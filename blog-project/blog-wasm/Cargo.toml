[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Storage",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "console",
] }

gloo-net = { version = "0.7.0", features = ["http", "json"] }

serde = { workspace = true }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"