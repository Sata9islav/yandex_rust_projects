[package]
name = "streaming_quotes"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
ctrlc = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"